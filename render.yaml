services:
  - type: web
    name: taskleaf
    branch: taskleaf
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: TRUST_PROXY
        value: "1"
      - key: OPENAI_API_KEY
        sync: false
      - key: APP_ACCESS_CODE
        generateValue: true
