<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Welcome to Taskleaf</title><style>
@import url('https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;500;600;700;800&display=swap');
*{box-sizing:border-box}body{margin:0;background:#f8f9f5;color:#293c31;font:14px 'Shantell Sans',cursive;min-height:100vh;display:grid;place-items:center;padding:36px 24px}.auth{width:100%;max-width:380px}.brand{font-size:27px;font-weight:800;letter-spacing:-1px;color:#385e4a}.brand span{font-size:32px;margin-right:9px}h1{font-size:30px;font-weight:600;margin:46px 0 12px;letter-spacing:-1px}p{color:#7d857d;line-height:1.7}.tabs{display:flex;gap:25px;margin:30px 0 25px;border-bottom:1px solid #e0e5d9}button,input{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}.tabs button{padding:10px 0;color:#88917e;border-bottom:2px solid transparent}.tabs button[aria-selected=true]{color:#385e4a;border-color:#385e4a}label{display:block;font-size:12px;margin:18px 0 8px}input{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid #c9d2c0;border-radius:0;padding:10px 0;color:#293c31}input:focus{outline:0;border-color:#385e4a}button:focus-visible{outline:2px solid #7f9a70;outline-offset:4px}.submit{background:#385e4a;color:#fff;width:100%;padding:13px;margin-top:28px;border-radius:6px}.submit:disabled{opacity:.6}.note{font-size:11px;margin-top:20px}.error{color:#a24a36;font-size:12px;min-height:18px;margin-top:16px}footer{font-size:12px;color:#8b9684;margin-top:48px} [hidden]{display:none!important}
</style></head><body><main class="auth"><div class="brand"><span>⌁</span>taskleaf</div><h1>A little space for you.</h1><p>Your tasks, your focus, your fresh start.<br>Pick up where you left off, on any device.</p><div class="tabs" role="tablist" aria-label="Account access"><button id="login-tab" role="tab" aria-selected="true" aria-controls="account-form">Log in</button><button id="signup-tab" role="tab" aria-selected="false" aria-controls="account-form">Sign up</button></div><form id="account-form"><label for="username">Username</label><input id="username" name="username" autocomplete="username" pattern="[A-Za-z0-9_]{3,30}" minlength="3" maxlength="30" required spellcheck="false" autocapitalize="none"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="10" maxlength="128" required><div id="confirm-wrap" hidden><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="10" maxlength="128"></div><button class="submit" id="submit">Log in →</button><div id="auth-error" class="error" role="status"></div></form><p id="signup-note" class="note" hidden>Username: 3–30 letters, numbers, or underscores.<br>Password: at least 10 characters. Keep it safe; password reset isn’t available yet.</p><footer>productivity, made simple.</footer></main><script>
let signup=false,busy=false;const el=id=>document.getElementById(id);function mode(value){if(busy)return;signup=value;el('login-tab').setAttribute('aria-selected',String(!value));el('signup-tab').setAttribute('aria-selected',String(value));el('confirm-wrap').hidden=!value;el('confirm-password').required=value;el('signup-note').hidden=!value;el('password').autocomplete=value?'new-password':'current-password';el('submit').textContent=value?'Create account →':'Log in →';el('auth-error').textContent=''}el('login-tab').onclick=()=>mode(false);el('signup-tab').onclick=()=>mode(true);el('account-form').onsubmit=async e=>{e.preventDefault();if(busy)return;if(signup&&el('password').value!==el('confirm-password').value){el('auth-error').textContent='Passwords don’t match.';return}busy=true;el('submit').disabled=true;el('auth-error').textContent=signup?'Creating your account…':'Logging in…';try{const r=await fetch('/api/account/'+(signup?'signup':'login'),{method:'POST',headers:{'content-type':'application/json'},signal:AbortSignal.timeout(20000),body:JSON.stringify({username:el('username').value,password:el('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'Could not continue.');location.replace('/')}catch(e){el('auth-error').textContent=e.name==='TimeoutError'?'That took too long. Please retry.':e.message||'Connection unavailable. Please retry.'}finally{busy=false;el('submit').disabled=false}};window.addEventListener('pageshow',e=>{if(e.persisted)location.reload()});
</script></body></html>
