name: Deploy Taskleaf to Render

on:
  push:
    branches: [taskleaf]
  workflow_dispatch:

# The job only calls the Render deploy hook; it needs no repository token access.
permissions: {}

concurrency:
  group: taskleaf-render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST "$RENDER_DEPLOY_HOOK_URL" \
            --output "$RUNNER_TEMP/render-response.json"
          python3 - "$RUNNER_TEMP/render-response.json" <<'PY'
          import json, sys
          with open(sys.argv[1]) as response:
              content = response.read().strip()
              data = json.loads(content) if content else {}
          deploy_id = data.get('deploy', {}).get('id')
          print('Render accepted the deployment' + (': ' + deploy_id if deploy_id else ' (queued).'))
          PY
