name: Deploy Taskleaf to Render

on:
  push:
    branches: [taskleaf]
  workflow_dispatch:

# The job only calls the Render deploy hook; it needs no repository token access.
permissions: {}

concurrency:
  group: taskleaf-render-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        shell: bash
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "Missing RENDER_DEPLOY_HOOK_URL repository secret."
            exit 1
          fi
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 60 \
            --request POST "$RENDER_DEPLOY_HOOK_URL" \
            --output /dev/null
          echo "Render accepted the deployment. Check Render Deploys for build status."
